name: Build X-Plane Plugins

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Windows Plugin (win.xpl)
        run: |
          gcc -O2 -shared -DIBM=1 -DXPLM200=1 -ISDK/CHeaders/XPLM demo_popup.c -o win.xpl -luser32 -lopengl32

      - name: Upload Windows Binary
        uses: actions/upload-artifact@v4
        with:
          name: win.xpl
          path: win.xpl

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev

      - name: Build Linux Plugin (lin.xpl)
        run: |
          gcc -O2 -shared -fPIC -DLIN=1 -DXPLM200=1 -fvisibility=hidden -ISDK/CHeaders/XPLM demo_popup.c -o lin.xpl -lGL

      - name: Upload Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: lin.xpl
          path: lin.xpl

  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build macOS Universal Binary (mac.xpl)
        run: |
          clang -O2 -dynamiclib -DAPL=1 -DXPLM200=1 -ISDK/CHeaders/XPLM \
            -arch x86_64 -arch arm64 \
            -framework OpenGL -framework CoreFoundation \
            demo_popup.c -o mac.xpl

      - name: Upload macOS Binary
        uses: actions/upload-artifact@v4
        with:
          name: mac.xpl
          path: mac.xpl
