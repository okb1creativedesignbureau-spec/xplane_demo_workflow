name: Build X-Plane Plugins

on: [push, workflow_dispatch]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch SDK Headers
        run: |
          mkdir -p SDK/CHeaders/XPLM
          mkdir -p SDK/CHeaders/Widgets
          git clone --depth 1 https://github.com/X-Plane/XPLM.git SDK/CHeaders/XPLM
          git clone --depth 1 https://github.com/X-Plane/Widgets.git SDK/CHeaders/Widgets

      - name: Build lin.xpl
        run: |
          mkdir -p 64
          SRC=$(find . -maxdepth 2 -name "demo_popup.c" | head -n 1)
          
          if [ -z "$SRC" ]; then
            echo "ERROR: demo_popup.c not found in repository!"
            exit 1
          fi

          gcc -shared -fPIC -O2 -o 64/lin.xpl "$SRC" \
            -ISDK/CHeaders -ISDK/CHeaders/XPLM -ISDK/CHeaders/Widgets \
            -DAPL=0 -DIBM=0 -DLIN=1 -DXPLM200=1 -DXPLM210=1 -DXPLM300=1 -fvisibility=hidden

          # Check binary output
          ls -l 64/lin.xpl

      - uses: actions/upload-artifact@v4
        with:
          name: lin.xpl
          path: 64/lin.xpl

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch SDK Headers
        run: |
          mkdir -p SDK/CHeaders/XPLM
          mkdir -p SDK/CHeaders/Widgets
          git clone --depth 1 https://github.com/X-Plane/XPLM.git SDK/CHeaders/XPLM
          git clone --depth 1 https://github.com/X-Plane/Widgets.git SDK/CHeaders/Widgets

      - name: Build mac.xpl (Universal Binary)
        run: |
          mkdir -p 64
          SRC=$(find . -maxdepth 2 -name "demo_popup.c" | head -n 1)

          if [ -z "$SRC" ]; then
            echo "ERROR: demo_popup.c not found in repository!"
            exit 1
          fi

          clang -dynamiclib -O2 -arch x86_64 -arch arm64 -o 64/mac.xpl "$SRC" \
            -ISDK/CHeaders -ISDK/CHeaders/XPLM -ISDK/CHeaders/Widgets \
            -DAPL=1 -DIBM=0 -DLIN=0 -DXPLM200=1 -DXPLM210=1 -DXPLM300=1 -fvisibility=hidden

          # Check binary output
          ls -l 64/mac.xpl

      - uses: actions/upload-artifact@v4
        with:
          name: mac.xpl
          path: 64/mac.xpl
