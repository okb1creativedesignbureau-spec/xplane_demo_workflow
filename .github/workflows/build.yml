name: Build X-Plane Plugins

on: [push, workflow_dispatch]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Official X-Plane SDK
        run: |
          mkdir -p SDK
          curl -sSL https://developer.x-plane.com/wp-content/plugins/code-sample-generation/sample_templates/XPSDK303.zip -o sdk.zip || true
          # Fallback download if zip fails: fetch primary XPLM headers directly
          mkdir -p SDK/CHeaders/XPLM
          curl -sSL https://raw.githubusercontent.com/X-Plane/XPLM/master/XPLMDefs.h -o SDK/CHeaders/XPLM/XPLMDefs.h || true

      - name: Build lin.xpl
        run: |
          mkdir -p 64
          # Locate demo_popup.c anywhere in the repo
          SRC=$(find . -name "demo_popup.c" | head -n 1)
          
          if [ -z "$SRC" ]; then
            echo "ERROR: demo_popup.c not found in repository!"
            exit 1
          fi

          gcc -shared -fPIC -O2 -o 64/lin.xpl "$SRC" \
            -I./CHeaders -I./CHeaders/XPLM -I./SDK/CHeaders -I./SDK/CHeaders/XPLM \
            -DAPL=0 -DIBM=0 -DLIN=1 -DXPLM200=1 -DXPLM210=1 -fvisibility=hidden

      - uses: actions/upload-artifact@v4
        with:
          name: lin.xpl
          path: 64/lin.xpl

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build mac.xpl (Universal Binary)
        run: |
          mkdir -p 64
          SRC=$(find . -name "demo_popup.c" | head -n 1)

          if [ -z "$SRC" ]; then
            echo "ERROR: demo_popup.c not found in repository!"
            exit 1
          fi

          clang -dynamiclib -O2 -arch x86_64 -arch arm64 -o 64/mac.xpl "$SRC" \
            -I./CHeaders -I./CHeaders/XPLM -I./SDK/CHeaders -I./SDK/CHeaders/XPLM \
            -DAPL=1 -DIBM=0 -DLIN=0 -DXPLM200=1 -DXPLM210=1 -fvisibility=hidden

      - uses: actions/upload-artifact@v4
        with:
          name: mac.xpl
          path: 64/mac.xpl
