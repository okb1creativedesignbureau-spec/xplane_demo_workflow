name: Build X-Plane Plugins

on: [push, workflow_dispatch]

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc build-essential
      - name: Build lin.xpl
        run: |
          mkdir -p 64
          # Searches for demo_popup.c and CHeaders if they are inside subfolders
          SRC=$(find . -name "demo_popup.c" | head -n 1)
          HDR=$(find . -type d -name "CHeaders" | head -n 1)
          
          if [ -z "$SRC" ]; then
            echo "Error: demo_popup.c not found in repository!"
            exit 1
          fi
          
          gcc -shared -fPIC -O2 -o 64/lin.xpl "$SRC" -I"$HDR/XPLM" -I"$HDR" -DAPL=0 -DIBM=0 -DLIN=1 -DXPLM200=1 -DXPLM210=1 -fvisibility=hidden
      - uses: actions/upload-artifact@v4
        with:
          name: lin.xpl
          path: 64/lin.xpl

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build mac.xpl (Universal Binary)
        run: |
          mkdir -p 64
          SRC=$(find . -name "demo_popup.c" | head -n 1)
          HDR=$(find . -type d -name "CHeaders" | head -n 1)
          
          if [ -z "$SRC" ]; then
            echo "Error: demo_popup.c not found in repository!"
            exit 1
          fi

          clang -dynamiclib -O2 -arch x86_64 -arch arm64 -o 64/mac.xpl "$SRC" -I"$HDR/XPLM" -I"$HDR" -DAPL=1 -DIBM=0 -DLIN=0 -DXPLM200=1 -DXPLM210=1 -fvisibility=hidden
      - uses: actions/upload-artifact@v4
        with:
          name: mac.xpl
          path: 64/mac.xpl
